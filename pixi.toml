[workspace]
description = "Mojo SQLite3 Bindings."
authors = ["Mikhail Tavarez <miktavarez@gmail.com>"]
channels = ["conda-forge", "https://conda.modular.com/max"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
license = "MIT"
license-file = "LICENSE"
readme = "README.md"
homepage = "https://github.com/thatstoasty/slight"
repository = "https://github.com/thatstoasty/slight"
preview = ["pixi-build"]

[tasks]
tests = "sh -c 'find test -name \"test_*.mojo\" -exec mojo -D ASSERT=all -I . {} \\;'"
benchmarks = "mojo -D ASSERT=all -I . benchmarks/run.mojo --print-relative"
examples = "sh -c 'find examples -name \"*.mojo\" -exec mojo -D ASSERT=all -I . {} \\;'"
test_readme_examples = "python3 utils/test_readme_examples.py"

# Linting and Formatting
lint_docs = "mojo doc --Werror --diagnose-missing-doc-strings -o /dev/null ./slight"
format = "mojo format slight --line-length 120"

# Build and publish
build = { cmd = "pixi build -o ." }
publish = { cmd = "find . -name 'slight-*.conda' | xargs pixi upload https://prefix.dev/api/v1/upload/mojo-community" }
build_and_publish = [{ task = "build" }, { task = "publish" }]

[package]
name = "slight"
version = "0.3.0"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.1.*" }

[dependencies]
mojo = ">=1.0.0,<1.1.0"
sqlite = ">=3.53.2,<4"

# TODO: json feature should be optional when Mojo supports conditional dependencies.
# emberjson = { git = "https://github.com/bgreni/EmberJson", tag = "0.3.2" }

[package.build-dependencies]
mojo-compiler = ">=1.0.0,<1.1.0"

[package.host-dependencies]
mojo-compiler = ">=1.0.0,<1.1.0"
sqlite = ">=3.50.4,<4"
# emberjson = { git = "https://github.com/bgreni/EmberJson", tag = "0.3.2" }

[package.run-dependencies]
mojo-compiler = ">=1.0.0,<1.1.0"
sqlite = ">=3.50.4,<4"
# emberjson = { git = "https://github.com/bgreni/EmberJson", tag = "0.3.2" }
